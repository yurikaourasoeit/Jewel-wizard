<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジュエルウィザード - 宝石収集大作戦！</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f0c1b;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1024px;
            height: 728px;
            max-width: 95vw;
            max-height: 90vh;
            aspect-ratio: 1024 / 728;
            box-shadow: 0 10px 40px rgba(138, 43, 226, 0.4), 0 0 80px rgba(0, 240, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            border: 4px solid #4a2e80;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        /* UI Overlays */
        .hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-card {
            background: rgba(20, 15, 45, 0.75);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .hud-label {
            font-size: 14px;
            font-weight: 700;
            color: #bfa8ef;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* HP Bar */
        .hp-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .hp-bar-outer {
            width: 180px;
            height: 18px;
            background: rgba(40, 20, 60, 0.8);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #ff4b72;
            position: relative;
        }
        .hp-bar-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff2a5f, #ff7597);
            border-radius: 8px;
            transition: width 0.15s ease-out;
            box-shadow: 0 0 10px #ff2a5f;
        }
        .hp-text {
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            min-width: 70px;
        }

        /* Gem Counter */
        .gem-icon {
            font-size: 24px;
            filter: drop-shadow(0 0 6px #ffd700);
            animation: bounce 1.5s infinite ease-in-out;
        }
        .gem-text-group {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .gem-count {
            font-size: 28px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
        }
        .gem-target {
            font-size: 16px;
            font-weight: 700;
            color: #a0a5cc;
        }

        /* Boss HP Warning HUD */
        #boss-hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            background: rgba(30, 10, 40, 0.85);
            border: 2px solid #ff2a5f;
            border-radius: 15px;
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 10;
        }
        #boss-hud.active {
            opacity: 1;
        }
        .boss-name {
            font-size: 14px;
            font-weight: 900;
            color: #ff5277;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 42, 95, 0.8);
        }
        .boss-hp-outer {
            width: 100%;
            height: 14px;
            background: rgba(50, 10, 20, 0.8);
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #ff4b72;
        }
        .boss-hp-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #aa00ff, #ff2a5f);
            transition: width 0.1s ease-out;
            box-shadow: 0 0 10px #ff2a5f;
        }

        /* Screen Overlays (Start, Victory, Gameover) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 8, 28, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 1;
            transition: opacity 0.4s ease;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-text {
            font-size: 44px;
            font-weight: 900;
            background: linear-gradient(135deg, #a855f7, #00f0ff, #ff4b72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle-text {
            font-size: 16px;
            color: #bfa8ef;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            color: #fff;
            font-family: inherit;
            font-size: 20px;
            font-weight: 800;
            padding: 14px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5), 0 0 15px rgba(6, 182, 212, 0.4);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.7), 0 0 25px rgba(6, 182, 212, 0.6);
        }
        .btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .instruction-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 30px;
            display: flex;
            gap: 24px;
        }
        .inst-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #d1c4e9;
        }
        .inst-icon {
            font-size: 24px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD -->
        <div class="hud">
            <!-- HP -->
            <div class="hud-card">
                <div class="hp-container">
                    <div class="hud-label">PLAYER HP</div>
                    <div class="hp-bar-outer">
                        <div id="hp-bar" class="hp-bar-inner"></div>
                    </div>
                </div>
                <div id="hp-text" class="hp-text">100/100</div>
            </div>

            <!-- Gem Count -->
            <div class="hud-card">
                <span class="gem-icon">💎</span>
                <div class="gem-text-group">
                    <span id="gem-count" class="gem-count">0</span>
                    <span class="gem-target">/ 20</span>
                </div>
            </div>
        </div>

        <!-- Boss HUD -->
        <div id="boss-hud">
            <div class="boss-name">⚠️ BOSS - 魔導大皇帝 ⚠️</div>
            <div class="boss-hp-outer">
                <div id="boss-hp-bar" class="boss-hp-inner"></div>
            </div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas" width="1024" height="728"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1 class="title-text">✨ ジュエルウィザード ✨</h1>
            <p class="subtitle-text">マウスやキーボードで魔法使いを自由に操作！<br>魔法を放ち、迫りくる悪魔やボスを倒して宝石を20個あつめよう！</p>
            
            <div class="instruction-box">
                <div class="inst-item">
                    <span class="inst-icon">🎮</span>
                    <span>マウス / 矢印キー(WASD): 移動</span>
                </div>
                <div class="inst-item">
                    <span class="inst-icon">🪄</span>
                    <span>攻撃: 自動連射</span>
                </div>
                <div class="inst-item">
                    <span class="inst-icon">💎</span>
                    <span>目標: 宝石20個獲得</span>
                </div>
            </div>

            <button id="start-btn" class="btn">ゲームスタート！</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="overlay hidden">
            <h1 class="title-text" style="background: linear-gradient(135deg, #ff2a5f, #ff7597); -webkit-background-clip: text;">GAME OVER</h1>
            <p class="subtitle-text" id="gameover-reason">魔法使いのHPがゼロになってしまった…</p>
            <div style="display: flex; gap: 16px;">
                <button id="restart-btn" class="btn">もう一度挑戦！</button>
                <button id="gameover-home-btn" class="btn" style="background: linear-gradient(135deg, #4b5563, #9ca3af);">タイトルへ戻る</button>
            </div>
        </div>

        <!-- Victory Screen -->
        <div id="victory-screen" class="overlay hidden">
            <h1 class="title-text" style="background: linear-gradient(135deg, #00f0ff, #70e000, #ffea00); -webkit-background-clip: text;">STAGE CLEAR!! 🎉</h1>
            <p class="subtitle-text">見事に宝石を20個以上集めて世界を救った！<br>素晴らしい魔法使いの誕生だ！</p>
            <div style="display: flex; gap: 16px;">
                <button id="clear-restart-btn" class="btn">もう一度あそぶ！</button>
                <button id="clear-home-btn" class="btn" style="background: linear-gradient(135deg, #4b5563, #9ca3af);">タイトルへ戻る</button>
            </div>
        </div>
    </div>

    <script>
        // Game Logic & Renderer
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const hpBar = document.getElementById('hp-bar');
        const hpText = document.getElementById('hp-text');
        const gemCountEl = document.getElementById('gem-count');
        const bossHud = document.getElementById('boss-hud');
        const bossHpBar = document.getElementById('boss-hp-bar');

        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const victoryScreen = document.getElementById('victory-screen');

        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const clearRestartBtn = document.getElementById('clear-restart-btn');
        const clearHomeBtn = document.getElementById('clear-home-btn');
        const gameoverHomeBtn = document.getElementById('gameover-home-btn');

        // Sound System (Web Audio API Synthesizer)
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            shoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            hit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }
            gem() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
            bossHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            clear() {
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.3);
                });
            }
        }
        const sfx = new SoundFX();

        // Game State
        let gameState = 'START'; // START, PLAYING, GAMEOVER, VICTORY
        let frameCount = 0;
        let lastTime = performance.now();

        // Stars Background
        const stars = Array.from({ length: 60 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 0.5 + 0.2,
            alpha: Math.random()
        }));

        // Player Parameters
        const player = {
            x: 80,
            targetX: 80,
            y: 300,
            targetY: 300,
            radius: 24,
            hp: 100,
            maxHp: 100,
            gems: 0,
            shootTimer: 0,
            shootInterval: 12, // Automatic rapid fire
            invincibleTimer: 0,
            trail: []
        };

        // Projectiles & Entities
        let playerBullets = [];
        let enemyBullets = [];
        let ghosts = [];
        let boss = null;
        let gems = [];
        let particles = [];

        // Game Progression Tracking
        let ghostsKilled = 0;
        let bossSpawned = false;

        // --- Controls (Trackpad / Mouse & Keyboard) ---
        const keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            
            // 画面全体の端から端まで移動可能
            const minX = player.radius + 10;
            const maxX = canvas.width - player.radius - 10;
            player.targetX = Math.max(minX, Math.min(maxX, mouseX));
            player.targetY = Math.max(player.radius + 10, Math.min(canvas.height - player.radius - 10, mouseY));
        });

        // --- Game Setup / Reset ---
        function initGame() {
            player.hp = 100;
            player.gems = 0;
            player.x = 80;
            player.targetX = 80;
            player.y = 300;
            player.targetY = 300;
            player.invincibleTimer = 0;
            player.trail = [];

            playerBullets = [];
            enemyBullets = [];
            ghosts = [];
            boss = null;
            gems = [];
            particles = [];

            ghostsKilled = 0;
            bossSpawned = false;
            frameCount = 0;

            updateUI();
            bossHud.classList.remove('active');
        }

        // --- Particle FX ---
        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color,
                    radius: Math.random() * 4 + 2,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        // --- Enemy Spawning Logic ---
        function spawnGhost() {
            ghosts.push({
                x: canvas.width + 30,
                baseY: Math.random() * (canvas.height - 120) + 60,
                y: 0,
                waveFreq: Math.random() * 0.05 + 0.03,
                waveAmp: Math.random() * 40 + 20,
                phase: Math.random() * Math.PI * 2,
                speed: Math.random() * 1.5 + 2,
                radius: 20,
                hp: 2,
                maxHp: 2
            });
        }

        // --- Spawn Boss ---
        function spawnBoss() {
            bossSpawned = true;
            bossHud.classList.add('active');
            boss = {
                x: canvas.width + 100,
                targetX: 800,
                y: canvas.height / 2,
                radius: 45,
                hp: 40,
                maxHp: 40,
                time: 0,
                attackTimer: 0,
                attackPattern: 0
            };
        }

        // --- Spawn Gems ---
        function dropGem(x, y, count = 1) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = count > 1 ? Math.random() * 5 + 2 : Math.random() * 2 + 1;
                gems.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 12,
                    rotation: Math.random() * Math.PI,
                    rotSpeed: (Math.random() - 0.5) * 0.1
                });
            }
        }

        // --- Update Game Loop ---
        function update() {
            if (gameState !== 'PLAYING') return;

            frameCount++;

            // Keyboard Control
            const keySpeed = 8;
            const minX = player.radius + 10;
            const maxX = canvas.width - player.radius - 10;
            const minY = player.radius + 10;
            const maxY = canvas.height - player.radius - 10;

            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                player.targetY = Math.max(minY, player.targetY - keySpeed);
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                player.targetY = Math.min(maxY, player.targetY + keySpeed);
            }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.targetX = Math.max(minX, player.targetX - keySpeed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.targetX = Math.min(maxX, player.targetX + keySpeed);
            }

            // Smooth Movement for Wizard (Horizontal and Vertical)
            player.x += (player.targetX - player.x) * 0.2;
            player.y += (player.targetY - player.y) * 0.2;

            // Player Trail effect
            if (frameCount % 2 === 0) {
                player.trail.push({ x: player.x - 10, y: player.y, alpha: 0.6, radius: player.radius * 0.8 });
            }
            player.trail.forEach(t => t.alpha -= 0.05);
            player.trail = player.trail.filter(t => t.alpha > 0);

            if (player.invincibleTimer > 0) player.invincibleTimer--;

            // Automatic Shoot
            player.shootTimer++;
            if (player.shootTimer >= player.shootInterval) {
                player.shootTimer = 0;
                playerBullets.push({
                    x: player.x + 20,
                    y: player.y,
                    vx: 12,
                    vy: 0,
                    radius: 6,
                    color: '#00f0ff'
                });
                sfx.shoot();
            }

            // Update Stars
            stars.forEach(s => {
                s.x -= s.speed;
                if (s.x < 0) s.x = canvas.width;
            });

            // Update Player Bullets
            playerBullets.forEach(b => b.x += b.vx);
            playerBullets = playerBullets.filter(b => b.x < canvas.width + 20);

            // Update Enemy Bullets
            enemyBullets.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;
            });
            enemyBullets = enemyBullets.filter(b => b.x > -20 && b.x < canvas.width + 20 && b.y > -20 && b.y < canvas.height + 20);

            // Spawn Ghost (stop when boss is spawned)
            if (!bossSpawned) {
                if (frameCount % 48 === 0) {
                    spawnGhost();
                }
                // Trigger Boss when 10 ghosts are defeated or time passes
                if (ghostsKilled >= 10 || frameCount > 1800) {
                    spawnBoss();
                }
            }

            // Update Ghosts
            ghosts.forEach(g => {
                g.x -= g.speed;
                g.phase += g.waveFreq;
                g.y = g.baseY + Math.sin(g.phase) * g.waveAmp;
            });

            // Update Boss
            if (boss) {
                boss.time += 0.03;
                if (boss.x > boss.targetX) {
                    boss.x -= 2;
                } else {
                    boss.y = (canvas.height / 2) + Math.sin(boss.time) * 140;
                }

                // Boss Attacks
                boss.attackTimer++;
                if (boss.attackTimer > 60) {
                    boss.attackTimer = 0;
                    boss.attackPattern = (boss.attackPattern + 1) % 2;

                    if (boss.attackPattern === 0) {
                        // Fan Attack
                        for (let a = -0.4; a <= 0.4; a += 0.2) {
                            enemyBullets.push({
                                x: boss.x - 30,
                                y: boss.y,
                                vx: Math.cos(Math.PI + a) * 6,
                                vy: Math.sin(Math.PI + a) * 6,
                                radius: 8,
                                color: '#ff2a5f'
                            });
                        }
                    } else {
                        // Direct Aim Shot
                        const angle = Math.atan2(player.y - boss.y, player.x - boss.x);
                        enemyBullets.push({
                            x: boss.x - 30,
                            y: boss.y,
                            vx: Math.cos(angle) * 8,
                            vy: Math.sin(angle) * 8,
                            radius: 10,
                            color: '#aa00ff'
                        });
                    }
                }

                // Update Boss UI
                bossHpBar.style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
            }

            // Update Gems (physics & magnet towards wizard when close)
            gems.forEach(gem => {
                gem.x += gem.vx;
                gem.y += gem.vy;
                gem.vx *= 0.92;
                gem.vy *= 0.92;
                gem.rotation += gem.rotSpeed;

                // Magnet effect when player gets nearby
                const dx = player.x - gem.x;
                const dy = player.y - gem.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 140) {
                    gem.x += (dx / dist) * 7;
                    gem.y += (dy / dist) * 7;
                }
            });

            // Update Particles
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
            });
            particles = particles.filter(p => p.alpha > 0);

            // --- Collisions & Damage Logic ---

            // Player Bullets vs Ghosts
            playerBullets.forEach((bullet, bIdx) => {
                ghosts.forEach((ghost, gIdx) => {
                    const dist = Math.hypot(bullet.x - ghost.x, bullet.y - ghost.y);
                    if (dist < bullet.radius + ghost.radius) {
                        ghost.hp--;
                        playerBullets.splice(bIdx, 1);
                        createExplosion(bullet.x, bullet.y, '#00f0ff', 6);
                        if (ghost.hp <= 0) {
                            ghostsKilled++;
                            dropGem(ghost.x, ghost.y, 1);
                            createExplosion(ghost.x, ghost.y, '#a855f7', 15);
                            ghosts.splice(gIdx, 1);
                            sfx.hit();
                        }
                    }
                });

                // Player Bullets vs Boss
                if (boss && bullet) {
                    const dist = Math.hypot(bullet.x - boss.x, bullet.y - boss.y);
                    if (dist < bullet.radius + boss.radius) {
                        boss.hp--;
                        playerBullets.splice(bIdx, 1);
                        createExplosion(bullet.x, bullet.y, '#ff4b72', 8);
                        sfx.bossHit();

                        if (boss.hp <= 0) {
                            // Boss Defeated! Drop 10 Gems
                            dropGem(boss.x, boss.y, 10);
                            createExplosion(boss.x, boss.y, '#ffea00', 40);
                            createExplosion(boss.x, boss.y, '#ff2a5f', 30);
                            boss = null;
                            bossHud.classList.remove('active');
                        }
                    }
                }
            });

            // Damage Player Function (HP minus 2 per hit requirement)
            function damagePlayer() {
                if (player.invincibleTimer > 0) return;
                player.hp = Math.max(0, player.hp - 2);
                player.invincibleTimer = 20; // brief flash
                sfx.hit();
                createExplosion(player.x, player.y, '#ff2a5f', 10);
                updateUI();

                if (player.hp <= 0) {
                    triggerGameOver();
                }
            }

            // Player vs Ghosts Collision
            ghosts.forEach(ghost => {
                const dist = Math.hypot(player.x - ghost.x, player.y - ghost.y);
                if (dist < player.radius + ghost.radius) {
                    damagePlayer();
                }
            });

            // Player vs Enemy Bullets
            enemyBullets.forEach((bullet, idx) => {
                const dist = Math.hypot(player.x - bullet.x, player.y - bullet.y);
                if (dist < player.radius + bullet.radius) {
                    enemyBullets.splice(idx, 1);
                    damagePlayer();
                }
            });

            // Player vs Boss Body
            if (boss) {
                const dist = Math.hypot(player.x - boss.x, player.y - boss.y);
                if (dist < player.radius + boss.radius) {
                    damagePlayer();
                }
            }

            // Player collecting Gems
            gems.forEach((gem, idx) => {
                const dist = Math.hypot(player.x - gem.x, player.y - gem.y);
                if (dist < player.radius + gem.radius) {
                    gems.splice(idx, 1);
                    player.gems++;
                    sfx.gem();
                    createExplosion(gem.x, gem.y, '#00f0ff', 8);
                    updateUI();

                    // Victory Condition: 20 or more gems collected
                    if (player.gems >= 20) {
                        triggerVictory();
                    }
                }
            });

            // Clean off-screen ghosts
            ghosts = ghosts.filter(g => g.x > -50);
        }

        // --- Render Game Elements ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Stars
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Player Trail
            player.trail.forEach(t => {
                ctx.fillStyle = `rgba(168, 85, 247, ${t.alpha * 0.4})`;
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Player (Pop Cute Wizard)
            if (gameState === 'PLAYING' || gameState === 'VICTORY') {
                ctx.save();
                ctx.translate(player.x, player.y);

                // Invincible flashing
                if (player.invincibleTimer % 4 > 2) {
                    ctx.globalAlpha = 0.5;
                }

                // Magical Aura Glow
                const auraGradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 35);
                auraGradient.addColorStop(0, 'rgba(0, 240, 255, 0.4)');
                auraGradient.addColorStop(1, 'rgba(168, 85, 247, 0)');
                ctx.fillStyle = auraGradient;
                ctx.beginPath();
                ctx.arc(0, 0, 35, 0, Math.PI * 2);
                ctx.fill();

                // Wizard Cloak / Body
                ctx.fillStyle = '#7c3aed';
                ctx.beginPath();
                ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
                ctx.fill();

                // Wizard Face
                ctx.fillStyle = '#ffe0bd';
                ctx.beginPath();
                ctx.arc(8, 0, 12, 0, Math.PI * 2);
                ctx.fill();

                // Big Cute Eyes
                ctx.fillStyle = '#1e1b4b';
                ctx.beginPath();
                ctx.arc(14, -3, 3, 0, Math.PI * 2);
                ctx.arc(14, 3, 3, 0, Math.PI * 2);
                ctx.fill();

                // Eye Highlights
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(15, -4, 1, 0, Math.PI * 2);
                ctx.arc(15, 2, 1, 0, Math.PI * 2);
                ctx.fill();

                // Pointy Wizard Hat
                ctx.fillStyle = '#4c1d95';
                ctx.beginPath();
                ctx.moveTo(-15, -10);
                ctx.lineTo(-30, -35);
                ctx.lineTo(5, -18);
                ctx.closePath();
                ctx.fill();

                // Hat Star / Ornament
                ctx.fillStyle = '#ffea00';
                ctx.beginPath();
                ctx.arc(-26, -30, 4, 0, Math.PI * 2);
                ctx.fill();

                // Magic Staff
                ctx.strokeStyle = '#8b5cf6';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(25, 20);
                ctx.stroke();

                // Staff Orb Glow
                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(27, 21, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.restore();
            }

            // Draw Player Bullets
            playerBullets.forEach(b => {
                ctx.save();
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Enemy Bullets
            enemyBullets.forEach(b => {
                ctx.save();
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Demons (Pop & Cute Little Devil)
            ghosts.forEach(g => {
                ctx.save();
                ctx.translate(g.x, g.y);

                // Floating wobble offset
                const wobble = Math.sin(frameCount * 0.1) * 3;

                // Devil Bat Wings (Back layer)
                ctx.fillStyle = '#4a044e';
                // Left Wing
                ctx.beginPath();
                ctx.moveTo(-5, wobble - 5);
                ctx.quadraticCurveTo(-25, wobble - 25, -30, wobble - 5);
                ctx.quadraticCurveTo(-20, wobble - 5, -15, wobble + 5);
                ctx.closePath();
                ctx.fill();
                // Right Wing
                ctx.beginPath();
                ctx.moveTo(5, wobble - 5);
                ctx.quadraticCurveTo(25, wobble - 25, 30, wobble - 5);
                ctx.quadraticCurveTo(20, wobble - 5, 15, wobble + 5);
                ctx.closePath();
                ctx.fill();

                // Devil Tail
                ctx.strokeStyle = '#dc2626';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-10, wobble + 10);
                ctx.quadraticCurveTo(-25, wobble + 20, -20, wobble + 28);
                ctx.stroke();
                // Tail Spear Tip
                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.moveTo(-20, wobble + 28);
                ctx.lineTo(-26, wobble + 25);
                ctx.lineTo(-24, wobble + 32);
                ctx.closePath();
                ctx.fill();

                // Main Devil Body
                ctx.fillStyle = '#7e22ce';
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, wobble, g.radius, 0, Math.PI * 2);
                ctx.fill();

                // Red Horns
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                // Left Horn
                ctx.moveTo(-10, wobble - 14);
                ctx.quadraticCurveTo(-18, wobble - 30, -6, wobble - 20);
                ctx.closePath();
                ctx.fill();
                // Right Horn
                ctx.moveTo(10, wobble - 14);
                ctx.quadraticCurveTo(18, wobble - 30, 6, wobble - 20);
                ctx.closePath();
                ctx.fill();

                // Glow Eyes (Golden / Red)
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(-7, wobble - 2, 4, 0, Math.PI * 2);
                ctx.arc(7, wobble - 2, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#dc2626';
                ctx.beginPath();
                ctx.arc(-6, wobble - 2, 2, 0, Math.PI * 2);
                ctx.arc(6, wobble - 2, 2, 0, Math.PI * 2);
                ctx.fill();

                // Cheek Blushes
                ctx.fillStyle = '#f43f5e';
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(-11, wobble + 5, 3, 0, Math.PI * 2);
                ctx.arc(11, wobble + 5, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                ctx.restore();
            });

            // Draw Boss (Grand Sorcerer Boss)
            if (boss) {
                ctx.save();
                ctx.translate(boss.x, boss.y);

                // Boss Aura
                const bossAura = ctx.createRadialGradient(0, 0, 20, 0, 0, 60);
                bossAura.addColorStop(0, 'rgba(255, 42, 95, 0.6)');
                bossAura.addColorStop(1, 'rgba(170, 0, 255, 0)');
                ctx.fillStyle = bossAura;
                ctx.beginPath();
                ctx.arc(0, 0, 65, 0, Math.PI * 2);
                ctx.fill();

                // Main Boss Body
                ctx.fillStyle = '#2e1065';
                ctx.shadowColor = '#ff2a5f';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(0, 0, boss.radius, 0, Math.PI * 2);
                ctx.fill();

                // Dark Crown / Horns
                ctx.fillStyle = '#ff2a5f';
                ctx.beginPath();
                ctx.moveTo(-35, -20);
                ctx.lineTo(-50, -50);
                ctx.lineTo(-20, -35);
                ctx.lineTo(0, -55);
                ctx.lineTo(20, -35);
                ctx.lineTo(50, -50);
                ctx.lineTo(35, -20);
                ctx.fill();

                // Boss Glowing Eyes
                ctx.fillStyle = '#ffea00';
                ctx.beginPath();
                ctx.arc(-15, -5, 6, 0, Math.PI * 2);
                ctx.arc(15, -5, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ff2a5f';
                ctx.beginPath();
                ctx.arc(-15, -5, 3, 0, Math.PI * 2);
                ctx.arc(15, -5, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // Draw Gems
            gems.forEach(gem => {
                ctx.save();
                ctx.translate(gem.x, gem.y);
                ctx.rotate(gem.rotation);

                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffea00';
                ctx.shadowBlur = 12;

                // Diamond Shape
                ctx.beginPath();
                ctx.moveTo(0, -gem.radius);
                ctx.lineTo(gem.radius * 0.8, -gem.radius * 0.3);
                ctx.lineTo(0, gem.radius);
                ctx.lineTo(-gem.radius * 0.8, -gem.radius * 0.3);
                ctx.closePath();
                ctx.fill();

                // Inner Gem Highlight
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(0, -gem.radius * 0.6);
                ctx.lineTo(gem.radius * 0.3, -gem.radius * 0.2);
                ctx.lineTo(0, gem.radius * 0.4);
                ctx.lineTo(-gem.radius * 0.3, -gem.radius * 0.2);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // --- UI Updates ---
        function updateUI() {
            hpBar.style.width = `${Math.max(0, player.hp)}%`;
            hpText.textContent = `${player.hp}/100`;
            gemCountEl.textContent = player.gems;
        }

        // --- Game End States ---
        function triggerGameOver() {
            gameState = 'GAMEOVER';
            gameoverScreen.classList.remove('hidden');
        }

        function triggerVictory() {
            gameState = 'VICTORY';
            sfx.clear();
            victoryScreen.classList.remove('hidden');
        }

        // --- Main Game Loop ---
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();

        // --- Event Listeners ---
        startBtn.addEventListener('click', () => {
            sfx.init();
            initGame();
            gameState = 'PLAYING';
            startScreen.classList.add('hidden');
        });

        restartBtn.addEventListener('click', () => {
            sfx.init();
            initGame();
            gameState = 'PLAYING';
            gameoverScreen.classList.add('hidden');
        });

        clearRestartBtn.addEventListener('click', () => {
            sfx.init();
            initGame();
            gameState = 'PLAYING';
            victoryScreen.classList.add('hidden');
        });

        clearHomeBtn.addEventListener('click', () => {
            initGame();
            gameState = 'START';
            victoryScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });

        gameoverHomeBtn.addEventListener('click', () => {
            initGame();
            gameState = 'START';
            gameoverScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
